name: Build Releases

on:
  schedule:
    - cron: '0 12 * * *'  # Daily at noon UTC
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  UPSTREAM_REPO: zanllp/sd-webui-infinite-image-browsing

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      built: ${{ steps.validate.outputs.valid == 'true' && steps.check.outputs.exists == 'false' }}

    steps:
      - name: Set image name lowercase
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Get latest upstream release
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST=$(gh api repos/${{ env.UPSTREAM_REPO }}/releases/latest --jq .tag_name)
          echo "version=$LATEST" >> $GITHUB_OUTPUT
          echo "Latest upstream release: $LATEST"

      - name: Validate upstream version
        id: validate
        run: |
          VERSION="${{ steps.upstream.outputs.version }}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "valid=false" >> $GITHUB_OUTPUT
            echo "::warning::No valid upstream release found, skipping build"
          else
            echo "valid=true" >> $GITHUB_OUTPUT
          fi

      - name: Check if tag exists in registry
        if: steps.validate.outputs.valid == 'true'
        id: check
        run: |
          TAG="${{ steps.upstream.outputs.version }}"
          if docker manifest inspect ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:$TAG > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag $TAG already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag $TAG does not exist, will build"
          fi

      - name: Checkout repository
        if: steps.validate.outputs.valid == 'true' && steps.check.outputs.exists == 'false'
        uses: actions/checkout@v4

      - name: Update Dockerfile for specific version
        if: steps.validate.outputs.valid == 'true' && steps.check.outputs.exists == 'false'
        run: |
          TAG="${{ steps.upstream.outputs.version }}"
          sed -i "s|git clone --depth 1|git clone --depth 1 --branch $TAG|" Dockerfile

      - name: Set up Docker Buildx
        if: steps.validate.outputs.valid == 'true' && steps.check.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: steps.validate.outputs.valid == 'true' && steps.check.outputs.exists == 'false'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.validate.outputs.valid == 'true' && steps.check.outputs.exists == 'false'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ steps.upstream.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-latest:
    needs: check-and-build
    if: needs.check-and-build.outputs.built == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set image name lowercase
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push latest
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
