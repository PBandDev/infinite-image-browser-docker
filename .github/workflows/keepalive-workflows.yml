name: Keepalive Workflows

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  keepalive:
    name: Keepalive scheduled workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/keepalive-workflow@v2
        with:
          workflow_files: "docker-publish.yml, docker-releases.yml, keepalive-workflows.yml"
