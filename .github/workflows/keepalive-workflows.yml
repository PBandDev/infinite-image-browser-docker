name: Keepalive Workflows

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  keepalive:
    name: Keepalive scheduled workflows
    runs-on: ubuntu-latest
    steps:
      - name: Refresh workflow activity
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_FILES: "docker-publish.yml docker-releases.yml keepalive-workflows.yml"
        run: |
          for workflow in $WORKFLOW_FILES; do
            gh api \
              --method PUT \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/enable"
          done
